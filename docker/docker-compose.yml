version: '3.8'

services:
  deepagi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
    volumes:
      - deepagi_data:/app/data
    restart: unless-stopped

volumes:
  deepagi_data:
